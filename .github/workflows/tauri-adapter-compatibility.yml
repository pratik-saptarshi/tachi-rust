name: tauri adapter compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 2"

permissions:
  contents: read

jobs:
  tauri-adapter-check:
    name: cargo check --manifest-path src-tauri/Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Print Rust toolchain proof
        run: |
          rustc -Vv
          cargo -Vv
          which rustc
          which cargo
          rustup which rustc

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Validate transitional adapter metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1

      - name: Check transitional adapter
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
