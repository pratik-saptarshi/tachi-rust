name: ci route observe

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route-observe:
    name: route decision artifact and stable orchestrator check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture route inputs
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          GIT_SHA: ${{ github.sha }}
          FORCE_FULL_CI: ${{ vars.FORCE_FULL_CI }}
        run: |
          set -euo pipefail

          base_ref="${BASE_REF:-}"
          if [ -z "$base_ref" ]; then
            base_ref="main"
          fi

          git fetch origin "$base_ref" --depth=1

          changed_paths_file="$RUNNER_TEMP/changed-paths.txt"
          bash "$GITHUB_WORKSPACE/scripts/ci-route-changed-paths.sh" \
            "origin/${base_ref}" "$GIT_SHA" > "$changed_paths_file"

          route_json="$(bash "$GITHUB_WORKSPACE/scripts/ci-route-classifier.sh" \
            "$GITHUB_EVENT_NAME" "${GITHUB_REF:-}" "$changed_paths_file" \
            "false" "${FORCE_FULL_CI:-false}")"
          route_mode="$(jq -r '.mode' <<<"$route_json")"
          route_reason="$(jq -r '.reason' <<<"$route_json")"
          repository_contracts_required="$(jq -r '.repository_contracts_required' <<<"$route_json")"
          selected_packages_json='[]'
          case "$route_mode" in
            passive_docs_only)
              selected_lanes_json='["docs-pr-gate","specialist-guards"]'
              ;;
            dependency_closure)
              selected_lanes_json='["dependency-closure"]'
              selected_packages_json="$(jq -c '.packages' <<<"$route_json")"
              ;;
            *)
              selected_lanes_json='["full-pr-matrix"]'
              ;;
          esac

          if [ "$route_mode" = "full_pr_matrix" ]; then
            escalation_reasons_json="$(jq -cn --arg reason "$route_reason" '[ $reason ]')"
          else
            escalation_reasons_json='[]'
          fi

          jq -n \
            --argjson route "$route_json" \
            --arg route_mode "$route_mode" \
            --arg route_reason "$route_reason" \
            --argjson selected_lanes "$selected_lanes_json" \
            --argjson selected_packages "$selected_packages_json" \
            --argjson repository_contracts_required "$repository_contracts_required" \
            --argjson escalation_reasons "$escalation_reasons_json" \
            '{mode:"observe_only",route_mode:$route_mode,route_reason:$route_reason,changed_paths:$route.changed_paths,selected_lanes:$selected_lanes,selected_packages:$selected_packages,repository_contracts_required:$repository_contracts_required,escalation_reasons:$escalation_reasons,policy_version:$route.policy_version}' \
            > route.json

          cat route.json
          {
            echo "route.json"
            echo "mode=observe_only"
            echo "route_mode=${route_mode}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload route decision artifact
        if: env.ACT_SMOKE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: route-decision
          path: route.json

      - name: Validate local act route artifact
        if: env.ACT_SMOKE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s route.json
          jq -e '(.mode == "observe_only") and (.route_mode == "full_pr_matrix" or .route_mode == "passive_docs_only" or .route_mode == "dependency_closure") and (.selected_lanes | length > 0) and (.policy_version | length > 0)' route.json >/dev/null
          echo "local act route artifact validated"
