name: rust supply-chain gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: cargo audit and cargo deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Shared Rust setup
        uses: ./.github/actions/rust-setup

      - name: Install pinned supply-chain tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.19.9 cargo-deny
          cargo audit --version
          cargo deny --version

      - name: Run cargo audit
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(date +%s%N)"
          cargo audit
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### cargo audit"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run cargo deny policy
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(date +%s%N)"
          cargo deny check advisories bans licenses sources
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### cargo deny"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"
