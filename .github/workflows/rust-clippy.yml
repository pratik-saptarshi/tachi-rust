# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy
# and https://rust-lang.github.io/rust-clippy/

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '25 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Shared Rust setup
        uses: ./.github/actions/rust-setup

      - name: Install required cargo
        run: |
          cargo install --locked --version 0.8.0 clippy-sarif
          cargo install --locked --version 0.8.0 sarif-fmt

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config

      - name: Run rust-clippy
        shell: bash
        run: |
          set +e
          start_ns="$(date +%s%N)"
          cargo clippy --all-features --all-targets --message-format=json -- -D warnings \
            | clippy-sarif \
            | tee rust-clippy-results.sarif \
            | sarif-fmt
          PIPE_STATUSES=("${PIPESTATUS[@]}")
          CLIPPY_STATUS=${PIPE_STATUSES[0]}
          CONVERTER_STATUS=${PIPE_STATUSES[1]}
          FORMATTER_STATUS=${PIPE_STATUSES[3]}
          jq -e '.version == "2.1.0" and (.runs | type == "array")' rust-clippy-results.sarif
          SARIF_STATUS=$?
          {
            echo "CLIPPY_STATUS=${CLIPPY_STATUS}"
            echo "CONVERTER_STATUS=${CONVERTER_STATUS}"
            echo "FORMATTER_STATUS=${FORMATTER_STATUS}"
            echo "SARIF_STATUS=${SARIF_STATUS}"
          } >> "$GITHUB_ENV"
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### rust-clippy"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rust-clippy-results.sarif
          category: clippy
          wait-for-processing: true

      - name: Fail on clippy or SARIF conversion errors
        if: always()
        run: |
          for status in CLIPPY_STATUS CONVERTER_STATUS FORMATTER_STATUS SARIF_STATUS; do
            value="${!status:-1}"
            if [ "$value" -ne 0 ]; then
              exit "$value"
            fi
          done
