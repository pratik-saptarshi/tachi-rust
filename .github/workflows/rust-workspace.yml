name: rust workspace tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_full_ci:
        description: Force full CI regardless of route prediction
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: route decision and stable orchestrator check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      reason: ${{ steps.route.outputs.reason }}
      packages_json: ${{ steps.route.outputs.packages_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture route mode
        id: route
        shell: bash
        env:
          FORCE_FULL_CI: ${{ vars.FORCE_FULL_CI }}
          FORCE_FULL_CI_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_full_ci }}
        run: |
          set -euo pipefail

          full_packages_json='["tachi-core","tachi-mcp","tachi-cli","tachi-shell","tachi-desktop"]'
          mode="full_pr_matrix"
          reason="non-pull_request events stay full mode"
          packages_json="$full_packages_json"
          active_contract_pattern='^(README\.md|CHANGELOG\.md|SECURITY\.md|docs/(roadmap/|standards/|guides/|bill-of-materials\.html\.md|publish-readiness-checklist\.html\.md|platform-compatibility\.md|tachi-rust-ci-|ci-improvement-plan\.html)|\.github/workflows/|Cargo\.toml$|Cargo.lock$|Makefile$|\.aod/|\.claude/|adapters/|crates/tachi-(cli|core|desktop|mcp|shell)/)'
          declare -A touched_crates=()
          declare -A selected_packages=()

          base_ref="${{ github.base_ref }}"
          if [ -z "$base_ref" ]; then
            base_ref="main"
          fi

          is_protected_ref() {
            case "$1" in
              main|release/*|refs/heads/main|refs/heads/release/*|refs/tags/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          add_package() {
            selected_packages["$1"]=1
          }

          closure_for() {
            case "$1" in
              tachi-core)
                printf '%s\n' tachi-core tachi-mcp tachi-cli tachi-shell tachi-desktop
                ;;
              tachi-shell)
                printf '%s\n' tachi-shell tachi-cli tachi-desktop
                ;;
              tachi-mcp)
                printf '%s\n' tachi-mcp
                ;;
              tachi-cli)
                printf '%s\n' tachi-cli
                ;;
              tachi-desktop)
                printf '%s\n' tachi-desktop
                ;;
            esac
          }

          selected_packages_json() {
            printf '%s\n' "${!selected_packages[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0)) | sort'
          }

          if [ "${FORCE_FULL_CI_INPUT:-}" = "true" ]; then
            reason="emergency full-ci override (workflow_dispatch input)"
          elif [ "${FORCE_FULL_CI:-}" = "true" ]; then
            reason="emergency full-ci override (repo variable)"
          elif case "${GITHUB_REF:-}" in
            refs/heads/main|refs/heads/release/*|refs/tags/*) true ;;
            *) false ;;
          esac; then
            reason="protected ref stays full mode"
          elif [ "${{ github.event_name }}" = "pull_request" ] && is_protected_ref "$base_ref"; then
            reason="protected ref stays full mode"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$base_ref" --depth=1

            changed_paths_file="$RUNNER_TEMP/changed-paths.txt"
            git diff --name-only "origin/${base_ref}...${{ github.sha }}" > "$changed_paths_file"

            if [ -z "$(tr -d '\n' < "$changed_paths_file")" ]; then
              reason="empty diff stays full mode"
            elif grep -Eq "$active_contract_pattern" "$changed_paths_file"; then
              reason="active docs or shared surface touched"
            elif grep -vq '^docs/' "$changed_paths_file"; then
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  crates/tachi-core/*) touched_crates["tachi-core"]=1 ;;
                  crates/tachi-shell/*) touched_crates["tachi-shell"]=1 ;;
                  crates/tachi-mcp/*) touched_crates["tachi-mcp"]=1 ;;
                  crates/tachi-cli/*) touched_crates["tachi-cli"]=1 ;;
                  crates/tachi-desktop/*) touched_crates["tachi-desktop"]=1 ;;
                esac
              done < "$changed_paths_file"

              if [ "${#touched_crates[@]}" -gt 0 ]; then
                mode="dependency_closure"
                reason="crate-local changes routed through dependency closure"
                for crate in "${!touched_crates[@]}"; do
                  while IFS= read -r package; do
                    [ -n "$package" ] && add_package "$package"
                  done < <(closure_for "$crate")
                done
                packages_json="$(selected_packages_json)"
              else
                reason="unknown non-docs paths stay full mode"
              fi
            else
              mode="passive_docs_only"
              reason="docs-only passive paths observed"
            fi
          fi

          {
            echo "mode=$mode"
            echo "reason=$reason"
            echo "packages_json=$packages_json"
          } >> "$GITHUB_OUTPUT"

          cat > route.json <<EOF
          {
            "mode": "${mode}",
            "reason": "${reason}",
            "force_full_ci_input": "${FORCE_FULL_CI_INPUT:-false}",
            "force_full_ci_var": "${FORCE_FULL_CI:-false}",
            "packages": ${packages_json}
          }
          EOF

          cat route.json

  cargo-test:
    name: cargo test -p ${{ matrix.package }} --all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: route
    if: needs.route.outputs.mode != 'passive_docs_only'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.route.outputs.packages_json) }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Shared Rust setup
        uses: ./.github/actions/rust-setup

      - name: Install workspace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config

      - name: Run full workspace test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(date +%s%N)"
          printf '%s\n' "$start_ns" > .ci-timing/start_ns
          if [ "${{ matrix.package }}" = "tachi-core" ]; then
            # ci_local_runner_contract contains process-tree timing checks that
            # must not contend with sibling test binaries on the same runner.
            cargo test -p ${{ matrix.package }} --all-targets -- --test-threads=1
          else
            cargo test -p ${{ matrix.package }} --all-targets
          fi
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### cargo-test ${{ matrix.package }}"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture package timing artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(cat .ci-timing/start_ns 2>/dev/null || date +%s%N)"
          end_ns="$(date +%s%N)"
          duration_ms="$(( (end_ns - start_ns) / 1000000 ))"
          jq -n \
            --arg stage "compile-and-test" \
            --arg unit "cargo-test-${{ matrix.package }}" \
            --arg package "${{ matrix.package }}" \
            --arg commit "${{ github.sha }}" \
            --arg workflow_name "${{ github.workflow }}" \
            --arg ref "${{ github.ref }}" \
            --arg source_head_sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --argjson duration_ms "$duration_ms" \
            '{schema_version:1,stage:$stage,unit:$unit,package:$package,commit:$commit,duration_ms:$duration_ms,runner:{os:"ubuntu-latest",event:env.GITHUB_EVENT_NAME,run_id:env.GITHUB_RUN_ID,attempt:env.GITHUB_RUN_ATTEMPT,workflow_name:$workflow_name,ref:$ref,head_sha:$commit,source_head_sha:$source_head_sha}}' \
            > .ci-timing/${{ matrix.package }}.json

      - name: Upload package timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-package-${{ matrix.package }}
          path: .ci-timing/${{ matrix.package }}.json
          if-no-files-found: error

  shell-tests:
    name: cargo test -p tachi-shell (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: route
    if: needs.route.outputs.mode != 'passive_docs_only'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shell-smoke
            command: cargo test -p tachi-shell --test command_registry --test coverage_audit --test infographic_data --test report_data_result --test tauri_shell_scaffold --test control_plane
          - suite: shell-init
            command: cargo test -p tachi-shell --test init_adversarial --test init_constitution --test init_defaults_env --test init_manifest_paths --test init_precommit_matrix --test init_substitution --test init_timing_trace --test init_trace_summary
          - suite: shell-integration
            command: cargo test -p tachi-shell --test tauri_bridge --test template_config_load --test template_git_clone_timeout
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Shared Rust setup
        uses: ./.github/actions/rust-setup

      - name: Install workspace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config

      - name: Run shell test suite slice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(date +%s%N)"
          printf '%s\n' "$start_ns" > .ci-timing/start_ns
          ${{ matrix.command }}
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### shell-tests ${{ matrix.suite }}"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture shell timing artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(cat .ci-timing/start_ns 2>/dev/null || date +%s%N)"
          end_ns="$(date +%s%N)"
          duration_ms="$(( (end_ns - start_ns) / 1000000 ))"
          jq -n \
            --arg stage "test-slice" \
            --arg unit "shell-tests-${{ matrix.suite }}" \
            --arg suite "${{ matrix.suite }}" \
            --arg commit "${{ github.sha }}" \
            --arg workflow_name "${{ github.workflow }}" \
            --arg ref "${{ github.ref }}" \
            --arg source_head_sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --argjson duration_ms "$duration_ms" \
            '{schema_version:1,stage:$stage,unit:$unit,suite:$suite,commit:$commit,duration_ms:$duration_ms,runner:{os:"ubuntu-latest",event:env.GITHUB_EVENT_NAME,run_id:env.GITHUB_RUN_ID,attempt:env.GITHUB_RUN_ATTEMPT,workflow_name:$workflow_name,ref:$ref,head_sha:$commit,source_head_sha:$source_head_sha}}' \
            > .ci-timing/${{ matrix.suite }}.json

      - name: Upload shell timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-shell-${{ matrix.suite }}
          path: .ci-timing/${{ matrix.suite }}.json
          if-no-files-found: error
