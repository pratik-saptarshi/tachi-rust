name: rust workspace tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_full_ci:
        description: Force full CI regardless of route prediction
        required: false
        type: boolean
        default: false
      control_tree_sha:
        description: Exact PR merge tree commit to execute for matched timing evidence
        required: false
        type: string
      control_pr_number:
        description: PR whose current merge ref must match control_tree_sha
        required: false
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: route decision and stable orchestrator check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      reason: ${{ steps.route.outputs.reason }}
      packages_json: ${{ steps.route.outputs.packages_json }}
      repository_contracts_required: ${{ steps.route.outputs.repository_contracts_required }}
      execution_sha: ${{ steps.provenance.outputs.execution_sha }}
      control_pr_head_sha: ${{ steps.provenance.outputs.control_pr_head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.control_pr_number != 0 && format('refs/pull/{0}/merge', inputs.control_pr_number) || github.event_name == 'workflow_dispatch' && inputs.control_tree_sha != '' && inputs.control_tree_sha || github.sha }}
          persist-credentials: false

      - name: Capture route mode
        id: route
        shell: bash
        env:
          FORCE_FULL_CI: ${{ vars.FORCE_FULL_CI }}
          FORCE_FULL_CI_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_full_ci }}
          BASE_REF: ${{ github.base_ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base_ref="${BASE_REF:-}"
          if [ -z "$base_ref" ]; then
            base_ref="main"
          fi

          changed_paths_file="$RUNNER_TEMP/changed-paths.txt"
          : > "$changed_paths_file"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$base_ref" --depth=1
            bash "$GITHUB_WORKSPACE/scripts/ci-route-changed-paths.sh" \
              "origin/${base_ref}" "$GIT_SHA" > "$changed_paths_file"
          fi

          route_json="$(bash "$GITHUB_WORKSPACE/scripts/ci-route-classifier.sh" \
            "$GITHUB_EVENT_NAME" "${GITHUB_REF:-}" "$changed_paths_file" \
            "${FORCE_FULL_CI_INPUT:-false}" "${FORCE_FULL_CI:-false}")"
          mode="$(jq -r '.mode' <<<"$route_json")"
          reason="$(jq -r '.reason' <<<"$route_json")"
          packages_json="$(jq -c '.packages' <<<"$route_json")"
          repository_contracts_required="$(jq -r '.repository_contracts_required' <<<"$route_json")"

          {
            echo "mode=$mode"
            echo "reason=$reason"
            echo "packages_json=$packages_json"
            echo "repository_contracts_required=$repository_contracts_required"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$route_json" > route.json
          cat route.json

      - name: Add matched-control provenance
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORCE_FULL_CI_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_full_ci }}
          CONTROL_TREE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.control_tree_sha || '' }}
          CONTROL_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.control_pr_number || 0 }}
        run: |
          set -euo pipefail
          execution_sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONTROL_PR_NUMBER" != "0" ] && [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "matched controls must dispatch the trusted default-branch workflow" >&2
            exit 1
          fi
          if { [ "$CONTROL_PR_NUMBER" != "0" ] && [ -z "$CONTROL_TREE_SHA" ]; } || { [ "$CONTROL_PR_NUMBER" = "0" ] && [ -n "$CONTROL_TREE_SHA" ]; }; then
            echo "control_pr_number and control_tree_sha must be supplied together" >&2
            exit 1
          fi
          if [ -n "$CONTROL_TREE_SHA" ] && [ "$execution_sha" != "$CONTROL_TREE_SHA" ]; then
            echo "checked out $(git rev-parse HEAD), expected control tree commit $CONTROL_TREE_SHA" >&2
            exit 1
          fi
          control_pr_head_sha=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONTROL_PR_NUMBER" != "0" ]; then
            control_pr_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CONTROL_PR_NUMBER}" --jq '.head.sha')"
            parents=" $(git show -s --format=%P HEAD) "
            case "$parents" in
              *" $control_pr_head_sha "*) ;;
              *)
                echo "control PR head $control_pr_head_sha is not a parent of executed merge commit $execution_sha" >&2
                exit 1
                ;;
            esac
          fi
          classifier_revision="$(git rev-parse HEAD:scripts/ci-route-classifier.sh)"
          path_producer_revision="$(git rev-parse HEAD:scripts/ci-route-changed-paths.sh)"
          if ! git cat-file -e "${WORKFLOW_SHA}:.github/workflows/rust-workspace.yml" 2>/dev/null; then
            git fetch origin "$WORKFLOW_SHA" --depth=1
          fi
          workflow_file_revision="$(git rev-parse "${WORKFLOW_SHA}:.github/workflows/rust-workspace.yml")"
          execution_workflow_file_revision="$(git rev-parse HEAD:.github/workflows/rust-workspace.yml)"
          execution_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          jq \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg head_sha "$SOURCE_HEAD_SHA" \
            --argjson pr_number "$PR_NUMBER" \
            --arg workflow_file_revision "$workflow_file_revision" \
            --arg execution_workflow_file_revision "$execution_workflow_file_revision" \
            --arg execution_sha "$execution_sha" \
            --arg execution_tree_sha "$execution_tree_sha" \
            --arg classifier_revision "$classifier_revision" \
            --arg path_producer_revision "$path_producer_revision" \
            --arg runner_definition "ubuntu-latest/${ImageOS:-unknown}/${ImageVersion:-unknown}/${RUNNER_ARCH:-unknown}" \
            --arg control_tree_sha "$CONTROL_TREE_SHA" \
            --arg control_pr_head_sha "$control_pr_head_sha" \
            --argjson control_pr_number "$CONTROL_PR_NUMBER" \
            --argjson force_full_requested "${FORCE_FULL_CI_INPUT:-false}" \
            '. + {run_id:$run_id,run_attempt:$run_attempt,event:$event,head_sha:$head_sha,pr_number:$pr_number,workflow_file_revision:$workflow_file_revision,execution_workflow_file_revision:$execution_workflow_file_revision,execution_sha:$execution_sha,tree_sha:$execution_tree_sha,classifier_revision:$classifier_revision,path_producer_revision:$path_producer_revision,runner_definition:$runner_definition,control_tree_sha:$control_tree_sha,control_pr_number:$control_pr_number,control_pr_head_sha:$control_pr_head_sha,force_full_requested:$force_full_requested}' \
            route.json > route.json.new
          mv route.json.new route.json
          echo "execution_sha=$execution_sha" >> "$GITHUB_OUTPUT"
          echo "control_pr_head_sha=$control_pr_head_sha" >> "$GITHUB_OUTPUT"
          cat route.json

      - name: Upload route decision artifact
        uses: actions/upload-artifact@v7
        with:
          name: route-decision
          path: route.json
          if-no-files-found: error

  cargo-test:
    name: cargo test -p ${{ matrix.package }} --all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [route]
    if: needs.route.outputs.mode != 'passive_docs_only'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.route.outputs.packages_json) }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.execution_sha }}
          persist-credentials: false

      # Matched controls execute untrusted PR code in workflow_dispatch scope.
      # Load the setup action from the workflow revision and disable its cache.
      - name: Checkout trusted Rust setup action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-trusted
          persist-credentials: false

      - name: Shared Rust setup
        uses: ./.ci-trusted/.github/actions/rust-setup
        with:
          use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.control_pr_number == 0 }}

      - name: Install workspace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config

      - name: Run full workspace test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(date +%s%N)"
          printf '%s\n' "$start_ns" > .ci-timing/start_ns
          if [ "${{ matrix.package }}" = "tachi-core" ]; then
            # ci_local_runner_contract contains process-tree timing checks that
            # must not contend with sibling test binaries on the same runner.
            cargo test -p ${{ matrix.package }} --all-targets -- --test-threads=1
          else
            cargo test -p ${{ matrix.package }} --all-targets
          fi
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### cargo-test ${{ matrix.package }}"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture package timing artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(cat .ci-timing/start_ns 2>/dev/null || date +%s%N)"
          end_ns="$(date +%s%N)"
          duration_ms="$(( (end_ns - start_ns) / 1000000 ))"
          jq -n \
            --arg stage "compile-and-test" \
            --arg unit "cargo-test-${{ matrix.package }}" \
            --arg package "${{ matrix.package }}" \
            --arg commit "${{ needs.route.outputs.execution_sha }}" \
            --arg workflow_name "${{ github.workflow }}" \
            --arg ref "${{ github.ref }}" \
            --arg source_head_sha "${{ github.event.pull_request.head.sha || needs.route.outputs.control_pr_head_sha || github.sha }}" \
            --argjson duration_ms "$duration_ms" \
            '{schema_version:1,stage:$stage,unit:$unit,package:$package,commit:$commit,duration_ms:$duration_ms,runner:{os:"ubuntu-latest",event:env.GITHUB_EVENT_NAME,run_id:env.GITHUB_RUN_ID,attempt:env.GITHUB_RUN_ATTEMPT,workflow_name:$workflow_name,ref:$ref,head_sha:$commit,source_head_sha:$source_head_sha}}' \
            > .ci-timing/${{ matrix.package }}.json

      - name: Upload package timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timing-package-${{ matrix.package }}
          path: .ci-timing/${{ matrix.package }}.json
          if-no-files-found: error

      - name: Capture runner provenance
        if: always()
        shell: bash
        env:
          RUNNER_KEY: cargo-test-${{ matrix.package }}
        run: |
          jq -n --arg key "$RUNNER_KEY" \
            --arg definition "ubuntu-latest/${ImageOS:-unknown}/${ImageVersion:-unknown}/${RUNNER_ARCH:-unknown}" \
            '{job_key:$key,runner_definition:$definition}' > runner.json

      - name: Upload runner provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-provenance-cargo-${{ matrix.package }}
          path: runner.json
          if-no-files-found: error

  repository-contracts:
    name: repository-wide contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [route]
    if: github.event_name != 'workflow_dispatch' && needs.route.outputs.repository_contracts_required == 'true'
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.execution_sha }}
          persist-credentials: false

      - name: Checkout trusted Rust setup action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-trusted
          persist-credentials: false

      - name: Shared Rust setup
        uses: ./.ci-trusted/.github/actions/rust-setup
        with:
          use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.control_pr_number == 0 }}

      - name: Install workspace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config

      - name: Run repository-wide contracts
        run: cargo test -p tachi-core --test workflow_ci_gates -- --test-threads=1

      - name: Capture runner provenance
        if: always()
        run: jq -n --arg definition "ubuntu-latest/${ImageOS:-unknown}/${ImageVersion:-unknown}/${RUNNER_ARCH:-unknown}" '{job_key:"repository-contracts",runner_definition:$definition}' > runner.json

      - name: Upload runner provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-provenance-repository-contracts
          path: runner.json
          if-no-files-found: error

  shell-tests:
    name: cargo test -p tachi-shell (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: route
    if: needs.route.outputs.mode != 'passive_docs_only'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shell-smoke
            command: cargo test -p tachi-shell --test command_registry --test coverage_audit --test infographic_data --test output_integrity_preservation --test report_data_result --test tauri_shell_scaffold --test control_plane
          - suite: shell-init
            command: cargo test -p tachi-shell --test init_adversarial --test init_constitution --test init_defaults_env --test init_manifest_paths --test init_precommit_matrix --test init_substitution --test init_timing_trace --test init_trace_summary
          - suite: shell-integration
            command: cargo test -p tachi-shell --test tauri_bridge --test template_config_load --test template_git_clone_timeout
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.execution_sha }}
          persist-credentials: false

      - name: Checkout trusted Rust setup action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-trusted
          persist-credentials: false

      - name: Shared Rust setup
        uses: ./.ci-trusted/.github/actions/rust-setup
        with:
          use-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.control_pr_number == 0 }}

      - name: Install workspace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep pkg-config

      - name: Run shell test suite slice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(date +%s%N)"
          printf '%s\n' "$start_ns" > .ci-timing/start_ns
          ${{ matrix.command }}
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### shell-tests ${{ matrix.suite }}"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture shell timing artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-timing
          start_ns="$(cat .ci-timing/start_ns 2>/dev/null || date +%s%N)"
          end_ns="$(date +%s%N)"
          duration_ms="$(( (end_ns - start_ns) / 1000000 ))"
          jq -n \
            --arg stage "test-slice" \
            --arg unit "shell-tests-${{ matrix.suite }}" \
            --arg suite "${{ matrix.suite }}" \
            --arg commit "${{ needs.route.outputs.execution_sha }}" \
            --arg workflow_name "${{ github.workflow }}" \
            --arg ref "${{ github.ref }}" \
            --arg source_head_sha "${{ github.event.pull_request.head.sha || needs.route.outputs.control_pr_head_sha || github.sha }}" \
            --argjson duration_ms "$duration_ms" \
            '{schema_version:1,stage:$stage,unit:$unit,suite:$suite,commit:$commit,duration_ms:$duration_ms,runner:{os:"ubuntu-latest",event:env.GITHUB_EVENT_NAME,run_id:env.GITHUB_RUN_ID,attempt:env.GITHUB_RUN_ATTEMPT,workflow_name:$workflow_name,ref:$ref,head_sha:$commit,source_head_sha:$source_head_sha}}' \
            > .ci-timing/${{ matrix.suite }}.json

      - name: Upload shell timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-timing-shell-${{ matrix.suite }}
          path: .ci-timing/${{ matrix.suite }}.json
          if-no-files-found: error

      - name: Capture runner provenance
        if: always()
        shell: bash
        env:
          RUNNER_KEY: shell-tests-${{ matrix.suite }}
        run: |
          jq -n --arg key "$RUNNER_KEY" \
            --arg definition "ubuntu-latest/${ImageOS:-unknown}/${ImageVersion:-unknown}/${RUNNER_ARCH:-unknown}" \
            '{job_key:$key,runner_definition:$definition}' > runner.json

      - name: Upload runner provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-provenance-shell-${{ matrix.suite }}
          path: runner.json
          if-no-files-found: error
