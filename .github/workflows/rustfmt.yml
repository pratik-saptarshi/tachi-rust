name: rustfmt check

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: cargo fmt --all -- --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Shared Rust setup
        uses: ./.github/actions/rust-setup
        with:
          include-rustfmt-proof: true

      - name: Run rustfmt guardrail
        shell: bash
        run: |
          set -euo pipefail
          start_ns="$(date +%s%N)"
          cargo fmt --all -- --check
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          {
            echo "### rustfmt"
            echo "- elapsed_ms: ${elapsed_ms}"
          } >> "$GITHUB_STEP_SUMMARY"
