name: Rust setup without cache
description: Install the pinned Rust toolchain and print proof without reading or writing dependency caches.

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup toolchain install --no-self-update

    - name: Print Rust toolchain proof
      shell: bash
      run: |
        rustc -Vv
        cargo -Vv
        which rustc
        which cargo
        rustup which rustc
